apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels: {app: {{ .Release.Name }}}
  template:
    metadata:
      labels: {app: {{ .Release.Name }}}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001        # must match the Dockerfile's useradd uid
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: muster-api
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          ports: [{containerPort: 8765}]
          env:
            {{- if eq .Values.valkey.mode "inline" }}
            - {name: MUSTER_VALKEY_URL, value: {{ printf "redis://%s-valkey:6379/0" .Release.Name | quote }}}
            {{- else }}
            - {name: MUSTER_VALKEY_URL, value: {{ required "valkey.url is required when valkey.mode=external" .Values.valkey.url | quote }}}
            {{- end }}
            - {name: MUSTER_RESOLVER_URL, value: {{ .Values.auth.resolverUrl | quote }}}
            - {name: MUSTER_RESOLVER_HEADER, value: {{ .Values.auth.resolverHeader | quote }}}
            - {name: MUSTER_USER_FIELD, value: {{ .Values.auth.userField | quote }}}
            - {name: MUSTER_GROUPS_FIELD, value: {{ .Values.auth.groupsField | quote }}}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          readinessProbe:
            httpGet: {path: /healthz, port: 8765}
